name: Deploy Browser Playtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Ensure single-threaded Web template
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ ! -f "$TEMPLATE_DIR/web_nothreads_release.zip" ] && [ -f "$HOME/downloads/export_templates.zip" ]; then
            unzip -j -o "$HOME/downloads/export_templates.zip" 'templates/web_nothreads_release.zip' -d "$TEMPLATE_DIR" || true
            unzip -j -o "$HOME/downloads/export_templates.zip" 'web_nothreads_release.zip' -d "$TEMPLATE_DIR" || true
          fi
          test -f "$TEMPLATE_DIR/web_nothreads_release.zip"

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-web-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource" godot-web-import.log; then
            echo "Godot Web import emitted a parser/resource failure"
            exit 1
          fi

      - name: Export browser playtest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" "build/web/index.html" 2>&1 | tee godot-web-export.log
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          if grep -E "SCRIPT ERROR:|Parse Error:|Project export .* failed|Failed to load script|Failed loading resource" godot-web-export.log; then
            echo "Godot Web export emitted a parser/resource failure"
            exit 1
          fi
          touch build/web/.nojekyll

      - name: Upload browser build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DyingSun-Web
          path: build/web/
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
