name: Dying Sun CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Structural verification
        run: python3 tests/verify_structure.py

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        run: godot --version

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource" godot-import.log; then
            echo "Godot import emitted a parser/resource failure"
            exit 1
          fi

      - name: Campaign state smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . --script res://tests/state_smoke.gd 2>&1 | tee godot-state-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|STATE_SMOKE FAILED|Failed to load script|Failed loading resource" godot-state-smoke.log; then
            echo "Campaign state smoke failed"
            exit 1
          fi
          grep -F "Dying Sun campaign state smoke passed" godot-state-smoke.log

      - name: Full campaign branch smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . res://tests/campaign_flow_smoke.tscn 2>&1 | tee godot-campaign-flow.log
          if grep -E "SCRIPT ERROR:|Parse Error:|CAMPAIGN_FLOW FAILED|ERROR:|Failed to load script|Failed loading resource" godot-campaign-flow.log; then
            echo "Full campaign branch smoke failed"
            exit 1
          fi
          grep -F "Dying Sun full campaign branch smoke passed" godot-campaign-flow.log

      - name: Combat kit smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . res://tests/combat_smoke.tscn 2>&1 | tee godot-combat-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|COMBAT_SMOKE FAILED|ERROR:|Failed to load script|Failed loading resource" godot-combat-smoke.log; then
            echo "Combat kit smoke failed"
            exit 1
          fi
          grep -F "Dying Sun combat kit smoke passed" godot-combat-smoke.log

      - name: Authored Act I smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . res://tests/sector_smoke.tscn 2>&1 | tee godot-sector-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|SECTOR_SMOKE FAILED|ERROR:|Failed to load script|Failed loading resource" godot-sector-smoke.log; then
            echo "Authored Act I smoke failed"
            exit 1
          fi
          grep -F "Dying Sun authored Act I sector smoke passed" godot-sector-smoke.log

      - name: Authored Act II smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . res://tests/act2_sector_smoke.tscn 2>&1 | tee godot-act2-sector-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ACT2_SECTOR_SMOKE FAILED|ERROR:|Failed to load script|Failed loading resource" godot-act2-sector-smoke.log; then
            echo "Authored Act II smoke failed"
            exit 1
          fi
          grep -F "Dying Sun authored Act II sector smoke passed" godot-act2-sector-smoke.log

      - name: Authored Act III smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . res://tests/act3_sector_smoke.tscn 2>&1 | tee godot-act3-sector-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ACT3_SECTOR_SMOKE FAILED|ERROR:|Failed to load script|Failed loading resource" godot-act3-sector-smoke.log; then
            echo "Authored Act III smoke failed"
            exit 1
          fi
          grep -F "Dying Sun authored Act III sector smoke passed" godot-act3-sector-smoke.log

      - name: Act I movement regression
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . res://tests/act1_movement_smoke.tscn 2>&1 | tee godot-act1-movement.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ACT1_MOVEMENT FAILED|ERROR:|Failed to load script|Failed loading resource" godot-act1-movement.log; then
            echo "Act I movement regression failed"
            exit 1
          fi
          grep -F "Dying Sun Act I movement smoke passed" godot-act1-movement.log

      - name: Mobile touch input smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . res://tests/touch_input_smoke.tscn 2>&1 | tee godot-touch-input.log
          if grep -E "SCRIPT ERROR:|Parse Error:|TOUCH_INPUT FAILED|ERROR:|Failed to load script|Failed loading resource" godot-touch-input.log; then
            echo "Mobile touch input smoke failed"
            exit 1
          fi
          grep -F "Dying Sun touch input smoke passed" godot-touch-input.log

      - name: Player-path polish smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . res://tests/player_path_polish_smoke.tscn 2>&1 | tee godot-player-path-polish.log
          if grep -E "SCRIPT ERROR:|Parse Error:|PLAYER_PATH_POLISH FAILED|ERROR:|Failed to load script|Failed loading resource" godot-player-path-polish.log; then
            echo "Player-path polish smoke failed"
            exit 1
          fi
          grep -F "Dying Sun player-path polish smoke passed" godot-player-path-polish.log

      - name: Scripted opening playtest
        shell: bash
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . res://tests/opening_playtest.tscn 2>&1 | tee godot-opening-playtest.log
          if grep -E "SCRIPT ERROR:|Parse Error:|OPENING_PLAYTEST FAILED|ERROR:|Failed to load script|Failed loading resource" godot-opening-playtest.log; then
            echo "Scripted opening playtest failed"
            exit 1
          fi
          grep -F "Dying Sun scripted opening playtest passed" godot-opening-playtest.log

      - name: Runtime smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . --quit-after 20 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource" godot-runtime.log; then
            echo "Godot runtime emitted a parser/resource failure"
            exit 1
          fi

      - name: Export Windows release build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/windows
          timeout 120s godot --headless --path . --export-release "Windows Desktop" "build/windows/DyingSun.exe" 2>&1 | tee godot-windows-export.log
          test -f build/windows/DyingSun.exe
          test -f build/windows/DyingSun.pck
          if grep -E "SCRIPT ERROR:|Parse Error:|Project export .* failed|Failed to load script|Failed loading resource" godot-windows-export.log; then
            echo "Windows export emitted a parser/resource failure"
            exit 1
          fi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DyingSun-Windows
          path: build/windows/
          if-no-files-found: error
